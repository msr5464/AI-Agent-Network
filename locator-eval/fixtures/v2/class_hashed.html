<!DOCTYPE html>

<meta charset="utf-8"/>
<title>Swag Shop</title>
<style>
  body{font:14px system-ui;margin:0;background:#f4f4f4;color:#132}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#132;color:#fff}
  .brand{font-weight:700;font-size:18px;margin-right:auto}
  .icon-btn{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:6px}
  main{max-width:900px;margin:24px auto;padding:0 20px}
  .panel{background:#fff;border-radius:8px;padding:20px;margin-bottom:20px}
  .form_group{margin-bottom:14px}
  label{display:block;font-size:12px;color:#567;margin-bottom:4px}
  .form_input{width:100%;padding:8px;border:1px solid #cdd;border-radius:4px;box-sizing:border-box}
  .btn_primary{background:#132;color:#fff;border:0;padding:10px 18px;border-radius:4px;cursor:pointer}
  .btn_secondary{background:#e6e9e8;border:0;padding:10px 18px;border-radius:4px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .inventory_item{background:#fff;border-radius:8px;padding:16px}
  .inventory_item_name{font-weight:600;margin-bottom:6px}
  .inventory_item_price{color:#282;margin:8px 0}
  .toolbar{display:flex;justify-content:flex-end;margin-bottom:12px}
</style>
<header>
<button aria-label="Open menu" class="icon-btn" data-gt="menu" id="react-burger-menu-btn">☰</button>
<span class="brand">Swag Shop</span>
<a aria-label="Shopping cart" class="css-1qx9v2f" data-cart="0" data-gt="cart" href="#cart">🛒</a>
</header>
<main>
<section class="panel" id="login_button_container">
<h2>Sign in to your account</h2>
<form>
<div class="form_group">
<label for="user-name">Username</label>
<input class="form_input" data-gt="username" id="user-name" name="user-name" placeholder="Username" type="text"/>
</div>
<div class="form_group">
<label for="password">Password</label>
<input class="form_input" data-gt="password" id="password" name="password" placeholder="Password" type="password"/>
</div>
<button class="css-0k2n9df" data-gt="login" id="login-button" name="login-button" type="submit">Login</button>
</form>
</section>
<section class="panel">
<h2>Products</h2>
<div class="toolbar">
<select aria-label="Sort products" class="product_sort_container" data-gt="sort" name="sort">
<option value="az">Name (A to Z)</option>
<option value="za">Name (Z to A)</option>
<option value="lohi">Price (low to high)</option>
</select>
</div>
<div class="grid">
<div class="inventory_item">
<div class="inventory_item_name">Sauce Labs Backpack</div>
<div class="inventory_item_price">$29.99</div>
<button class="css-1k2n9df" data-gt="add_backpack" data-testid="add-backpack">Add to cart</button>
</div>
<div class="inventory_item">
<div class="inventory_item_name">Sauce Labs Bike Light</div>
<div class="inventory_item_price">$9.99</div>
<button class="css-2k2n9df" data-gt="add_bikelight" data-testid="add-bikelight">Add to cart</button>
</div>
<div class="inventory_item">
<div class="inventory_item_name">Sauce Labs Bolt T-Shirt</div>
<div class="inventory_item_price">$15.99</div>
<button class="css-3k2n9df" data-gt="add_tshirt" data-testid="add-tshirt">Add to cart</button>
</div>
</div>
</section>
<!-- Utility-class markup, mirroring the real NaukriProfilePage: the locator
       ends up pinned to a styling decision (div.rounded-2.5xl / div.bg-black). -->
<section class="panel" id="summary_section">
<h2>Profile summary</h2>
<div class="rounded-2xl bg-slate-50 px-4 py-2" data-gt="summary_box">
<p>Experienced QA engineer, six years in test automation.</p>
<button aria-label="Edit profile summary" class="bg-black text-white px-3 py-1" data-gt="edit_summary" type="submit">Edit</button>
</div>
</section>
<section class="panel" id="profile_section">
<h2>Profile</h2>
<div class="form_group">
<label for="display-name">Display name</label>
<input class="form_input" data-gt="displayname" id="display-name" name="display-name" type="text"/>
</div>
<button class="css-4k2n9df" data-gt="save" id="save-btn" name="save">Save changes</button>
</section>
</main>
<p id="app-status" role="status"></p>
<script>
  const status = t => document.getElementById('app-status').textContent = t;
  document.addEventListener('click', e => {
    const el = e.target.closest('button, a');
    if (!el) return;
    if (el.matches('.btn_secondary, [data-testid^=add]')) {
      const card = el.closest('.inventory_item');
      const name = card ? card.querySelector('.inventory_item_name').textContent.trim() : '?';
      const cart = document.querySelector('[data-cart]');
      if (cart) { cart.dataset.cart = String(Number(cart.dataset.cart || 0) + 1);
                  cart.dataset.lastAdded = name; }
      status('Added: ' + name);
      e.preventDefault();
    } else if (el.closest('#summary_section')) {
      status('Summary editor opened'); e.preventDefault();
    } else if (el.closest('#profile_section')) {
      status('Profile saved');  e.preventDefault();
    } else if (el.closest('form, .form_actions') || el.id === 'login-button') {
      status('Login attempted'); e.preventDefault();
    } else if (el.matches('[data-cart], .shopping_cart_link, [class*=cart]')) {
      status('Cart opened');    e.preventDefault();
    }
  });
  document.addEventListener('change', e => {
    if (e.target.tagName === 'SELECT') status('Sorted: ' + e.target.value);
  });
</script>
